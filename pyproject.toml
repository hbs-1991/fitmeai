[project]
name = "fatsecret-mcp"
version = "0.2.0"
description = "Model Context Protocol server for FatSecret Platform API"
readme = "README.md"
requires-python = ">=3.10"
authors = [
    {name = "FatSecret MCP", email = "example@example.com"}
]
dependencies = [
    "fastmcp>=3.0.0b1",
    "requests>=2.31.0",
    "requests-oauthlib>=1.3.0",
    "pydantic>=2.5.0",
    "python-dotenv>=1.0.0",
]

[project.scripts]
fatsecret-mcp = "fatsecret_mcp.__main__:main"
fatsecret-chart = "fatsecret_mcp.cli.chart:main"

[project.optional-dependencies]
chart = ["matplotlib>=3.8.0"]
local = ["keyring>=24.0.0"]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.21.0",
    "black>=23.0.0",
    "ruff>=0.1.0",
    "responses>=0.24.0",
]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py310']

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
